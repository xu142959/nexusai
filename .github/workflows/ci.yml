name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nexusai/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nexusai
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/nexusai/go.mod
          cache-dependency-path: packages/nexusai/go.sum

      - name: Prepare frontend embed placeholder
        run: mkdir -p web/dist && printf '<!doctype html><html><body>CI placeholder</body></html>' > web/dist/index.html

      - name: Build
        run: go build -o nexusai .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 20m

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
