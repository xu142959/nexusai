version: '3.8'

services:
  # NexusAI 主服务（前端 + 后端一体）
  nexusai:
    build:
      context: ./packages/new-api
      dockerfile: Dockerfile
    container_name: nexusai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SQL_DSN=postgresql://nexusai:nexusai_password@postgres:5432/nexusai?sslmode=disable
      - REDIS_CONN_STRING=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-random-secret}
      - CRYPTO_SECRET=${CRYPTO_SECRET:-change-me-to-a-random-secret}
      - PORT=3000
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - nexusai-data:/data
    networks:
      - nexusai-network

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: nexusai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nexusai
      - POSTGRES_PASSWORD=nexusai_password
      - POSTGRES_DB=nexusai
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai -d nexusai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusai-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nexusai-network

volumes:
  nexusai-data:
  postgres-data:
  redis-data:

networks:
  nexusai-network:
    driver: bridge
